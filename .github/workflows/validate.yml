name: Validate addon
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6,Node24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6,Node24
        with:
          python-version: '3.12'
      - name: Install target Lua runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - run: python scripts/validate.py
      - run: python scripts/package.py
