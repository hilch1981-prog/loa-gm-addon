name: Validate addon
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install target Lua runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - run: python scripts/validate.py
      - run: python scripts/package.py
